name: Release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Build and verify from the tagged tree
        run: python scripts/verify.py
      - name: Audit version, history, and artifacts
        run: python scripts/release_check.py --skip-verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: loopledger-${{ github.ref_name }}-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 30
