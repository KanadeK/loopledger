name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release-gate dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run complete verification
        run: python scripts/verify.py
      - name: Upload coverage and release candidates
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: loopledger-ci-evidence
          path: |
            coverage.xml
            dist/*
          if-no-files-found: error
          retention-days: 14
